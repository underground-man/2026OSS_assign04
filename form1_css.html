<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms (CSS)</title>
    <style>
        body {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 10px;
            font-family: sans-serif;
        }
        form {
            padding: 20px;
            background-color: #f2f2f2;
            border-radius: 8px;
        }
        fieldset {
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        legend {
            font-weight: bold;
        }
        label {
            color: #333;
        }
        input[type=text], input[type=date], input:not([type]), select, textarea {
            display: inline-block;
            width: 100%;
            padding: 8px;
            font-size: 14px;
            margin: 4px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            border: 2px solid #4CAF50;
            outline: none;
        }
        input[type=submit] {
            width: 100%;
            padding: 12px;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type=submit]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>HTML Forms (CSS)</h1>
    <a href="index.html">메인으로</a>

    <h2>1. 사용자 정보 입력</h2>
    <form action="form_ok.html" method="get">
        <fieldset>
            <legend>기본 정보</legend>

            <label for="uname">이름</label><br>
            <input type="text" id="uname" name="uname"><br><br>

            <label for="email">이메일</label><br>
            <input type="text" id="email" name="email"><br><br>

            <label for="birth">생년월일</label><br>
            <input type="date" id="birth" name="birth"><br><br>

            성별<br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">남성</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">여성</label>
        </fieldset>

        <fieldset>
            <legend>관심사</legend>

            <label for="major">전공</label><br>
            <select id="major" name="major">
                <optgroup label="공학">
                    <option value="cse">컴퓨터공학</option>
                    <option value="ee">전자공학</option>
                </optgroup>
                <optgroup label="인문">
                    <option value="biz">경영학</option>
                    <option value="psy">심리학</option>
                </optgroup>
            </select><br><br>

            관심 분야<br>
            <input type="checkbox" id="web" name="interest" value="web">
            <label for="web">웹</label>
            <input type="checkbox" id="ai" name="interest" value="ai">
            <label for="ai">AI</label>
            <input type="checkbox" id="game" name="interest" value="game">
            <label for="game">게임</label><br><br>

            <label for="lang">좋아하는 언어</label><br>
            <input list="langs" id="lang" name="lang">
            <datalist id="langs">
                <option value="C">
                <option value="Java">
                <option value="Python">
            </datalist><br><br>

            <label for="color">좋아하는 색</label><br>
            <input type="color" id="color" name="color"><br><br>

            <label for="intro">자기소개</label><br>
            <textarea id="intro" name="intro" rows="4" cols="40"></textarea>
        </fieldset>
        <br>
        <input type="submit" value="제출">
    </form>

    <!-- Clone Coding 원본 URL: https://getbootstrap.com/docs/5.2/examples/checkout/ -->
    <h2>2. 주문하기</h2>
    <form action="form_ok.html" method="get">
        <h3>장바구니 (3)</h3>
        <ul>
            <li>상품 1 - 12,000원</li>
            <li>상품 2 - 8,000원</li>
            <li>상품 3 - 5,000원</li>
            <li>합계 - 25,000원</li>
        </ul>

        <h3>배송지 정보</h3>
        <label for="name">이름</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="address">주소</label><br>
        <input type="text" id="address" name="address" required><br><br>

        <label for="city">지역</label><br>
        <select id="city" name="city">
            <option value="">선택하세요</option>
            <option>서울</option>
            <option>경기</option>
            <option>경북</option>
        </select><br><br>

        <label for="zip">우편번호</label><br>
        <input type="text" id="zip" name="zip"><br><br>

        <input type="checkbox" id="save" name="save">
        <label for="save">다음에도 이 정보 사용</label>

        <h3>결제 방법</h3>
        <input type="radio" id="card" name="pay" value="card" checked>
        <label for="card">신용카드</label>
        <input type="radio" id="bank" name="pay" value="bank">
        <label for="bank">계좌이체</label><br><br>

        <label for="cardno">카드 번호</label><br>
        <input type="text" id="cardno" name="cardno"><br><br>

        <input type="submit" value="주문하기">
    </form>
</body>
</html>
