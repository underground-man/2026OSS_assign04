<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제출 완료</title>
</head>
<body>
    <h1>제출 완료</h1>
    <p>Form에서 전송된 값 (GET 방식이라 URL의 query string으로 전달됩니다)</p>
    <ul id="result"></ul>
    <p><a href="javascript:history.back()">← 돌아가기</a> | <a href="index.html">메인으로</a></p>

    <script>
        const params = new URLSearchParams(location.search);
        const list = document.getElementById("result");
        for (const [key, value] of params) {
            const li = document.createElement("li");
            li.textContent = key + " = " + value;
            list.appendChild(li);
        }
        if (!list.children.length) {
            list.innerHTML = "<li>전송된 값이 없습니다.</li>";
        }
    </script>
</body>
</html>
